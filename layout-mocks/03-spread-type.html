<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Couchette — Layout mock · Spread typo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1410;
      --night: #080b10;
      --paper: #f5f0e8;
      --paper-2: #ebe4d8;
      --muted: rgba(26, 20, 16, 0.58);
      --ember: #c45c2a;
      --font-display: "Fraunces", Georgia, serif;
      --font: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 0.52fr) minmax(0, 0.48fr);
      gap: clamp(1.5rem, 4vw, 3.5rem);
      align-items: center;
      padding: clamp(1.5rem, 5vh, 3rem) clamp(1.1rem, 4vw, 3.25rem);
      max-width: 1180px;
      margin: 0 auto;
    }
    .type-col { max-width: 28rem; }
    .kicker {
      margin: 0 0 1.25rem;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(26, 20, 16, 0.42);
    }
    .display {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 7.5vw, 5.6rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.96;
    }
    .hook {
      margin: 1.75rem 0 0;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 17rem;
      border-left: 1.5px solid var(--ember);
      padding-left: 1rem;
    }
    .photo {
      justify-self: end;
      width: min(100%, 420px);
    }
    .vitre {
      position: relative;
      background: linear-gradient(165deg, #2a241c, #12100d);
      padding: 8px;
      border-radius: 3px;
      box-shadow:
        0 0 0 1px rgba(26, 20, 16, 0.12),
        0 22px 50px rgba(26, 20, 16, 0.18);
    }
    .glass {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 2px;
      background: #0a0e18;
    }
    .media { position: absolute; inset: 0; }
    .media video,
    .media img {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      object-fit: cover;
      object-position: center 40%;
      display: block;
    }
    .media video { z-index: 1; }
    .media img { z-index: 0; }
    .grade {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(12, 8, 6, 0.15) 0%, transparent 35%, rgba(10, 6, 4, 0.4) 100%),
        linear-gradient(90deg, rgba(255, 158, 92, 0.1) 0%, transparent 50%);
      mix-blend-mode: soft-light;
    }
    .grain {
      position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0.2;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }
    .legend {
      margin: 0.65rem 0 0;
      font-size: 0.75rem;
      font-family: var(--font-display);
      font-style: italic;
      color: rgba(26, 20, 16, 0.48);
    }
    .mock-tag {
      position: fixed; top: 0.75rem; right: 0.85rem; z-index: 20;
      font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(26,20,16,0.35); pointer-events: none;
    }
    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .photo {
        justify-self: stretch;
        width: min(100%, 360px);
        margin-inline: auto;
      }
      .display { font-size: clamp(2.8rem, 14vw, 4rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .media video { display: none !important; }
    }
  </style>
</head>
<body>
  <span class="mock-tag">Mock 03 · Spread typo</span>
  <main class="page">
    <div class="type-col">
      <p class="kicker">Couchette</p>
      <h1 class="display">Une nuit<br />européenne.</h1>
      <p class="hook">Le paysage défile. Vous restez.</p>
    </div>
    <figure class="photo" aria-label="Vitré cabine">
      <div class="vitre">
        <div class="glass">
          <div class="media">
            <video muted playsinline loop autoplay preload="metadata" poster="../media/cabin-night-poster.jpg" aria-hidden="true">
              <source src="../media/cabin-night.mp4" type="video/mp4" />
            </video>
            <img src="../media/cabin-night-poster.jpg" alt="" />
          </div>
          <div class="grade" aria-hidden="true"></div>
          <div class="grain" aria-hidden="true"></div>
        </div>
      </div>
      <figcaption class="legend">Paris → Vienne</figcaption>
    </figure>
  </main>
</body>
</html>
