<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Couchette — Layout mock · Éditorial asymétrique</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1410;
      --night: #080b10;
      --paper: #f5f0e8;
      --muted: rgba(245, 240, 232, 0.58);
      --ember: #c45c2a;
      --font-display: "Fraunces", Georgia, serif;
      --font: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--night);
      color: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 0.42fr) minmax(0, 0.58fr);
      gap: clamp(1.25rem, 3vw, 2.75rem);
      align-items: center;
      padding: clamp(1.25rem, 4vh, 2.5rem) clamp(1rem, 3.5vw, 2.75rem);
      max-width: 1280px;
      margin: 0 auto;
    }
    .copy { padding-block: 1rem; max-width: 22rem; }
    .eyebrow {
      margin: 0 0 1.1rem;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 240, 232, 0.42);
    }
    .eyebrow::after {
      content: "";
      display: block;
      width: 1.75rem;
      height: 1px;
      margin-top: 0.85rem;
      background: var(--ember);
      opacity: 0.85;
    }
    .display {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.35rem, 5.2vw, 3.85rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }
    .hook {
      margin: 1.35rem 0 0;
      font-size: 1.02rem;
      line-height: 1.5;
      color: var(--muted);
      max-width: 18rem;
    }
    .vitre {
      position: relative;
      width: 100%;
      border-radius: 4px 4px 2px 2px;
      overflow: hidden;
      background: linear-gradient(160deg, #2a241c 0%, #12100d 100%);
      padding: 9px 9px 9px;
      box-shadow:
        0 0 0 1px rgba(255, 220, 180, 0.08),
        0 28px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 230, 200, 0.1);
    }
    .glass {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 2px;
      background: #0a0e18;
    }
    .media { position: absolute; inset: 0; }
    .media video,
    .media img {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      display: block;
    }
    .media video { z-index: 1; }
    .media img { z-index: 0; }
    .grade {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(12, 8, 6, 0.22) 0%, transparent 30%, rgba(14, 8, 4, 0.35) 100%),
        linear-gradient(90deg, rgba(255, 158, 92, 0.08) 0%, transparent 40%, rgba(40, 70, 110, 0.12) 100%);
      mix-blend-mode: soft-light;
    }
    .grain {
      position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0.22;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }
    .mock-tag {
      position: fixed; top: 0.75rem; right: 0.85rem; z-index: 20;
      font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(245,240,232,0.35); pointer-events: none;
    }
    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        padding-block: 2rem 1.5rem;
      }
      .copy { max-width: none; order: 1; }
      .vitre { order: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .media video { display: none !important; }
    }
  </style>
</head>
<body>
  <span class="mock-tag">Mock 02 · Éditorial asym</span>
  <main class="page">
    <div class="copy">
      <p class="eyebrow">Corridor nocturne</p>
      <h1 class="display">Paris →<br />Vienne</h1>
      <p class="hook">Le paysage défile. Vous restez.</p>
    </div>
    <figure class="vitre" aria-label="Vitré cabine">
      <div class="glass">
        <div class="media">
          <video muted playsinline loop autoplay preload="metadata" poster="../media/cabin-night-poster.jpg" aria-hidden="true">
            <source src="../media/cabin-night.mp4" type="video/mp4" />
          </video>
          <img src="../media/cabin-night-poster.jpg" alt="" />
        </div>
        <div class="grade" aria-hidden="true"></div>
        <div class="grain" aria-hidden="true"></div>
      </div>
    </figure>
  </main>
</body>
</html>
